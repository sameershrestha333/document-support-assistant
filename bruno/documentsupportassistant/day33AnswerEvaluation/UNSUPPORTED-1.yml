info:
  name: UNSUPPORTED-1
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/documents/ask
  body:
    type: json
    data: |-
      {"documentId":"{{day33DocumentId}}","question":"How long are uploads retained?"}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Checks the response and citation", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.supported).to.equal(false);
          expect(body.status).to.equal("INSUFFICIENT_EVIDENCE");
          expect(body.citation).to.equal(null);
        });
