info:
  name: DOCUMENT-3
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/documents/ask
  body:
    type: json
    data: |-
      {"documentId":"{{day33DocumentId}}","question":"Can I upload DOCX?"}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Checks the response and citation", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.supported).to.equal(true);
          expect(body.answer.trim()).not.to.equal("");
          expect(body.evidence.trim()).to.be.a("string").and.not.equal("");
          expect("The service accepts only PDF and TXT files.").to.include(body.evidence.trim());
          expect(body.citation.fileName).to.equal("sample-input-file.pdf");
          expect(body.citation.pageNumber).to.equal(1);
          expect(body.citation.passageId.trim()).not.to.equal("");
        });
