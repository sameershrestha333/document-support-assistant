spring.application.name=document-support-assistant
# Configure the model and API key
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL}

spring.ai.openai.chat.max-tokens=150

spring.ai.openai.timeout=10s
spring.ai.openai.max-retries=1

spring.ai.openai.embedding.model=text-embedding-3-small

spring.datasource.url=jdbc:postgresql://localhost:5434/dsa
spring.datasource.username=dsa
spring.datasource.password=${DSA_DB_PASSWORD}

spring.ai.tools.limits.max-total-tool-calls=1
spring.ai.tools.limits.on-limit-exceeded=THROW
app.import-guide.document-id=671d940b6e99e6c4210502b6badc6ed1f5a884a81f441dff511ecc45e003c9d5
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
